<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    tactical: {
                        bg: '#04070c',
                        panel: '#0b1329',
                        panelBorder: '#1f293d',
                        accent: '#2563eb',
                        cyan: '#38bdf8',
                        purple: '#7d3db7',
                        gold: '#d97706',
                        danger: '#ef4444',
                        success: '#10b981'
                    }
                },
                fontFamily: {
                    mono: ['Share Tech Mono', 'monospace'],
                    title: ['Syne', 'sans-serif'],
                    sans: ['Inter', 'sans-serif']
                }
            }
        }
    }
</script>

<!-- Google Fonts: Syne & Inter & Share Tech Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Leaflet CSS & JS for Custom GTA V Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    body {
        font-family: 'Inter', sans-serif;
        background-color: #04070c;
        color: #cbd5e1;
        overflow: hidden;
    }

    /* Tactical Terminal Scanlines & Grid Overlay */
    .scanlines {
        background: linear-gradient(
            rgba(18, 16, 16, 0) 50%, 
            rgba(0, 0, 0, 0.25) 50%
        ), linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.01),
            rgba(0, 255, 0, 0.01),
            rgba(0, 0, 255, 0.01)
        );
        background-size: 100% 3px, 6px 100%;
        pointer-events: none;
    }

    .hud-grid {
        background-size: 40px 40px;
        background-image: 
            linear-gradient(to right, rgba(30, 41, 59, 0.15) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(30, 41, 59, 0.15) 1px, transparent 1px);
    }

    /* Modern Rounded HUD Panels */
    .hud-panel {
        background-color: #0b1329;
        border: 1px solid #1f293d;
        border-radius: 1rem;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    ::-webkit-scrollbar-track {
        background: #04070c;
    }
    ::-webkit-scrollbar-thumb {
        background: #1f293d;
        border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #38bdf8;
    }

    /* Map Fixes & Styling */
    .leaflet-container {
        background: #000000 !important;
        font-family: 'Share Tech Mono', monospace !important;
    }
    .leaflet-image-layer {
        object-fit: contain !important;
        image-rendering: -webkit-optimize-contrast;
    }
    .leaflet-popup-content-wrapper {
        background: #0b1329 !important;
        color: #ffffff !important;
        border: 1px solid #7d3db7;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(125, 61, 183, 0.4);
        padding: 4px;
    }
    .leaflet-popup-tip {
        background: #7d3db7 !important;
    }

    /* Toggle Switch */
    .switch {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
        position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
        background-color: #333; transition: .3s; border-radius: 20px;
    }
    .slider:before {
        position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;
        background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #7d3db7; }
    input:checked + .slider:before { transform: translateX(16px); }

    /* Lightbox Image Preview */
    #lightbox {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.92); z-index: 10000; justify-content: center; align-items: center;
        cursor: pointer; backdrop-filter: blur(8px);
    }
    #lightbox img { max-width: 85%; max-height: 85%; border: 2px solid #7d3db7; border-radius: 12px; box-shadow: 0 0 35px rgba(125, 61, 183, 0.6); }

    /* Custom Popup Content */
    .popup-container { color: #fff; text-align: center; width: 220px; padding: 4px; }
    .popup-img { 
        width: 100%; height: 120px; object-fit: cover; border-radius: 8px; 
        margin-bottom: 6px; border: 1px solid #7d3db7; cursor: pointer; 
        transition: 0.2s; background: #000;
    }
    .popup-img:hover { filter: brightness(1.2); }
    .popup-title { font-size: 15px; font-weight: bold; font-family: 'Syne', sans-serif; color: #7d3db7; margin-bottom: 4px; display: block; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .popup-info-row { font-size: 11px; margin: 3px 0; display: flex; justify-content: space-between; gap: 8px; font-family: monospace; }
    .info-label { color: #888; font-weight: bold; }
    .info-value { color: #ddd; text-align: right; }

    @media print {
        body { background: white !important; color: black !important; }
        aside, header, button, .no-print { display: none !important; }
        .print-area { width: 100% !important; margin: 0 !important; padding: 0 !important; }
    }
</style>
